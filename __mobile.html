<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>390px 미리보기</title>
<style>html,body{margin:0;background:#DFE5EE;font:13px/1.4 sans-serif}
.wrap{display:flex;gap:18px;padding:14px}
.frame{width:390px;height:844px;border:0;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.2);background:#fff;overflow:hidden}
</style></head>
<body><div class="wrap"><iframe class="frame" id="f" src="./index.html?pnu=4111710700104170002#check" title="390"></iframe></div>
<script>
/* QA 하니스 — 390px 프레임 안에서 점포를 고른 뒤 그 카드를 보여준다(배포용 아님) */
const f = document.getElementById('f');
f.onload = () => {
  const w = f.contentWindow;
  const tick = () => {
    let hit = null;
    try { hit = (w.t1Match && w.t1Match('GS25망포센트럴점')) || null; } catch (_) { hit = null; }
    if (!hit || !hit.length || !w.t1Select) return setTimeout(tick, 300);
    w.t1Select(hit[0]);
    setTimeout(() => {
      const el = f.contentDocument.querySelector('.bld-card');
      if (el) el.scrollIntoView({ block: 'center' });
    }, 1800);
  };
  tick();
};
</script></body></html>
